<!doctype html>
<html lang="en" data-boot="none">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'"
    />
    <meta name="color-scheme" content="light dark" />
    <title>ThinCoder</title>
    <link rel="stylesheet" href="./theme.css" />
    <link rel="stylesheet" href="./chrome.css" />
    <link rel="stylesheet" href="./session-list.css" />
    <link rel="stylesheet" href="./skin.css" />
    <link rel="stylesheet" href="./chat.css" />
    <link rel="stylesheet" href="./chat-cards.css" />
    <link rel="stylesheet" href="./chat-composer.css" />
    <link rel="stylesheet" href="./chat-fixes.css" />
    <link rel="stylesheet" href="./core-markdown.css" />
    <link rel="stylesheet" href="./core.css" />
    <link rel="stylesheet" href="/rc/search.css" />
    <link rel="stylesheet" href="./pool.css" />
    <link rel="stylesheet" href="./settings.css" />
  </head>
  <body>
    <!-- 首屏引导层（R1）：`data-boot` ≠ `ok` 期间在场——冷启首帧 = 引导面（非空骨架）。置 `ok` ⇒ 节点移除（零残留）；
         `error` ⇒ 错误面（`.boot-reason` 显原因——引导面拿不到词表 ⇒ 文案 = 运行期注入的诊断串）。
         静态骨架默认可见（零 JS 动作）；零面向用户字符串（文案仅运行期注入，风格同 `<title>` 例外行）。 -->
    <div class="boot-gate" id="boot-gate" role="status">
      <div class="boot-spinner" aria-hidden="true"></div>
      <p class="boot-reason" id="boot-reason" hidden></p>
    </div>
    <!-- 两列骨架（`docs/desktop/design/UI.md` §1 布局行）：中区 = 会话（会话控制条 + 对话流）· 右栏 = 活动池。
         状态栏 = **窗口级底行**（`.app` 第 3 子元素 ⇒ 跨两列 · 两列框外一行——位置单源 = `UI.md` §1 状态栏行；需求图 `docs/desktop/requirements/PROJECT.md` §3.1 同形）。
         各区容器 = 视图批填充锚（`data-slot`）：中区三槽（`session-control` = 批 4 · 对话流槽 `flow` = 批 6〔挂载根 = 滚动容器自身〕· 输入区槽 `composer` = 批 A〔`.session` 内 · 对话流之后 —— 可见面恒在〕；`status` = 窗口级底行另计）；会话控制条 = `.session` 首子元素（VSC 形 —— 会话模型轮 R13：原标签条 ∕ 左列两面随裁撤退场）。
         批 9 一容器：设置 / 向导 = `settings`（**窗口级覆盖层面** —— 两列栅格之外 · body 末子元素 · 一容器两树互斥 · 样式住 `settings.css`）。
         **零面向用户字符串**——词表供给面 = `config:read` 语言面下发（同档 §1 i18n 行：本端不另立词表源）⇒ 文案随视图批，经 `renderer/i18n.mjs`。例外仅 `<title>`（窗口标题 = 产品名，非词表项）。 -->
    <div class="app" id="app">
      <main class="session">
        <div data-slot="session-control"></div>
        <div class="flow" data-slot="flow"></div>
        <div class="composer" data-slot="composer"></div>
      </main>
      <aside class="pool">
        <div class="pool-resizer" data-pool-resizer role="separator" aria-orientation="vertical"></div>
        <div class="pool-body" data-slot="pool"></div>
      </aside>
      <footer class="status" data-slot="status"></footer>
    </div>
    <!-- 设置 / 向导 = 窗口级覆盖层面（两列栅格外 · body 末子元素 ⇒ DOM 序在 `.app` 之后 —— 覆盖面不透底）：
         **一容器两树互斥占槽**（`configured` 假 ⇒ 向导树，真 ⇒ 设置树 —— 占槽裁决 = `renderer/mount-settings.mjs`）；
         两退场都清容器（构零子节点）⇒ 空容器 / 关态的整层退场 = `renderer/settings.css`（`:empty` + `[data-state="closed"]`）。 -->
    <div data-slot="settings"></div>
    <script type="module" src="./app.mjs"></script>
  </body>
</html>
