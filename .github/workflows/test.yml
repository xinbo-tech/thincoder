name: test
on: [push, pull_request]
jobs:
  cli:
    name: thincoder (CLI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: thincoder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm install
      - run: npm test
      - run: npm run lint
  vscode:
    name: thincoder-vscode (extension)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: thincoder-vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm install
      - run: npm test
      - run: npm run lint
